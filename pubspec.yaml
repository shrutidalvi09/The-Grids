name: the_grids
description: "The Grids – Smart Living. Smart Spaces. Housing society management for India."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: any
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  razorpay_flutter: ^1.4.7
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# Launcher icons, rendered from GridsLogo by tool/render_app_icon_test.dart.
# Regenerate: flutter test tool/render_app_icon_test.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 24
